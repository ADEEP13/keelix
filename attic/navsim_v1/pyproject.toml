[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navsim"
version = "0.1.0"
description = "Physics-based PlanetScope naval-vessel simulator and classical analysis harness"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
io = ["rasterio>=1.3"]
geo = ["shapely>=2.0", "pyproj>=3.5", "networkx>=3.0"]
plot = ["matplotlib>=3.7"]
full = ["rasterio", "shapely", "pyproj", "networkx", "pandas", "scikit-image", "filterpy"]

[project.scripts]
navsim = "navsim.cli:main"

[tool.setuptools.packages.find]
include = ["navsim*"]
