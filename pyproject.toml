[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navsim"
version = "2.0.0"
description = "Naval Base Watch: naval base activity from free Sentinel-1 radar"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "requests>=2.28",
    "rasterio>=1.3",
    "pyproj>=3.5",
    "pillow>=9.0",
]

[project.scripts]
navsim = "navsim.cli:main"

[tool.setuptools.packages.find]
include = ["navsim*"]
exclude = ["attic*"]
